        <h1>CARRITO</h1>
        <div class="menu-contenedor">
            <button class="boton-menu" onclick="mostrarMenu()">
                <img src="imagenes/pokeball.png" alt="Menú">

    <main>
        <p>Los pedidos se pagan y se recojen únicamente en tienda. <a href="nosotros.html">Ubicación.</a></p>
        <div class="barra-roja">
            <h2>Productos seleccionados</h2>
        </div>

        <div id="carrito">
            Tu carrito está vacío.
        </div>

        <h2>Total: <span id="totalCarrito">$0.00 MXN</span></h2>

        <div class="barra-azul">
            <h2>Datos para realizar el pedido</h2>
        </div>

        <form id="formularioPedido" class="formulario">
            <label>Nombre:</label>
            <input type="text" name="nombre" maxlength="100" required>

            <label>Correo electrónico:</label>
            <input type="email" name="correo" maxlength="150" required>

            <label>Teléfono:</label>
            <input type="tel" name="telefono" maxlength="20">

            <label>Observaciones:</label>
            <textarea name="observaciones"></textarea>

            <button type="submit">Confirmar pedido</button>
        </form>
        <p id="mensajePedido"></p>
